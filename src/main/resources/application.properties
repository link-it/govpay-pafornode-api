# ------------- SPRING ---------------
spring.main.banner-mode=off

# ----------- SPRING SERVLET ------------

server.port=10004

server.error.whitelabel.enabled=true

# abilitazione Endpoint /actuator/health/liveness
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ------------ LOGGING (govpay-common) ------------------
# Transaction id e correlation id in ogni riga di log (BP-LOG-3), popolati dal
# TransactionIdFilter di govpay-common.
logging.pattern.level=%5p [%X{transactionId:-},%X{correlationId:-}]

# I livelli di log dinamici su database (BP-LOG-1): richiedono la base dati di GovPay,
# ora configurata (vedi sotto).
govpay.logging.livelli-dinamici.enabled=true
govpay.logging.livelli-dinamici.intervallo-refresh=${LOG_LEVEL_REFRESH_INTERVAL:60s}
govpay.logging.livelli-dinamici.logger-gestiti[0]=it.govpay

# ------------- DATASOURCE / JPA (stesso schema di govpay-pendenze-api) -------------

spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ------------- AUTENTICAZIONE (govpay-common-auth) -------------
# Stessa libreria/schema di govpay-console-api: un solo metodo alla volta,
# scelto per deployment in base al cliente (non piu' metodi insieme come in
# console-api, che li offre come alternative di login per popolazioni diverse
# di utenti). Nessuno dei due e' abilitato di default: finche' non viene
# impostato un flag qui sotto, ogni richiesta su /ws/** fallisce (fail
# closed) — e' la libreria stessa a bloccare tutto non appena esiste un
# GovpayPrincipalLoader nel contesto (PaForNodePrincipalLoader), a prescindere
# da quale metodo verra' poi scelto.
#
# Certificato client mTLS terminato in questa applicazione (comportamento
# storico del legacy, vedi wars/api-pagopa/.../api-pagopa-applicationContext-security.xml):
#govpay.auth.ssl.enabled=true
#
# In alternativa, se il TLS e' terminato da un reverse proxy/API gateway che
# propaga il certificato via header (da confermare con il team infra):
#govpay.auth.ssl-header.enabled=true
#govpay.auth.ssl-header.principal-header-name=X-SSL-Client-Cert

# Liveness/readiness e metriche Prometheus non fanno parte del contratto
# paForNode (li usano orchestratori/monitoring, non il Nodo dei Pagamenti):
# restano raggiungibili senza certificato client, stesso trattamento che
# govpay-console-api applica ai propri endpoint operativi.
govpay.auth.public-chain.enabled=true
govpay.auth.public-chain.permit-all-paths[0].path=/actuator/health
govpay.auth.public-chain.permit-all-paths[0].methods[0]=GET
govpay.auth.public-chain.permit-all-paths[1].path=/actuator/prometheus
govpay.auth.public-chain.permit-all-paths[1].methods[0]=GET

# -------------- OBSERVABILITY (Prometheus) ----------------

# Via web sono esposti il solo endpoint di scrape e health (per le probe
# di container/orchestratori). Di default rispondono sulla porta applicativa;
# impostando la variabile d'ambiente MANAGEMENT_SERVER_PORT si spostano su
# una porta dedicata.
# 'loggers' NON e' incluso di default: sarebbe un endpoint di scrittura non
# autenticato (BP-SEC-2). Va abilitato solo insieme a una porta management
# dedicata e segregata in rete, per esempio:
#   MANAGEMENT_SERVER_PORT=9090 MANAGEMENT_ENDPOINTS=health,prometheus,loggers
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,prometheus}
# Istogrammi (bucket) sulle latenze server: permettono a Prometheus di
# aggregare percentili tra piu' istanze.
# NB: aumenta serie e memoria. Da tenere in considerazione nelle configurazioni in produzione
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Bucket esplicito vicino alla soglia SLA pagoPA (2s).
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s
# Tag comune per distinguere il servizio quando Prometheus raccoglie piu' app.
management.metrics.tags.application=govpay-pafornode-api
