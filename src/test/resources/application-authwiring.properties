# Profilo usato solo da PaForNodeAuthWiringTest: verifica che il wiring
# "di produzione" (nessuna esclusione della security auto-configuration,
# un metodo govpay.auth.* abilitato) faccia partire il contesto senza bean
# mancanti. Non simula un certificato client reale (richiederebbe una chain
# TLS o SecurityMockMvcRequestPostProcessors.x509, deliberatamente fuori
# scope per ora — vedi Javadoc di PaForNodePrincipalLoader).
spring.main.banner-mode=off

server.port=0

spring.datasource.url=jdbc:h2:mem:pafornode-authwiring-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:db/schema-pendenze-test.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

govpay.auth.ssl.enabled=true
