# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

server.port=10004

# ddl-auto=validate, non create-drop: lo schema NON viene generato dalle entita', si
# verifica solo che corrisponda a quello reale (stesso schema condiviso di
# govpay-pendenze-api/govpay-common-pendenze).
# Lo schema e' caricato dal parametro INIT del driver H2 e non da spring.sql.init:
# quest'ultimo viene eseguito DOPO che Hibernate ha gia' validato le entita' contro uno
# schema ancora vuoto.
spring.datasource.url=jdbc:h2:mem:pafornode-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:db/schema-pendenze-test.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Autenticazione: la catena di govpay-common-auth resta attiva anche nei test
# (PaForNodePrincipalLoader non e' escluso per profilo) — il metodo HEADER e'
# il piu' semplice da simulare via HTTP (un header, nessun certificato/TLS) e
# serve solo a questo: esercitare per davvero il confronto principal/idBrokerPA
# in PaForNodeEndpoint, non a decidere il metodo di produzione (SSL/SSL_HEADER,
# vedi application.properties). PaForNodeEndpointTest imposta l'header con il
# principal registrato sull'intermediario di fixture.
govpay.auth.header.enabled=true

# Invio sincrono degli eventi GDE nei test (vedi Javadoc di AsyncGdeConfig): cosi' i test
# che verificano l'evento lo trovano senza dover attendere il thread async.
app.gde.async=false
