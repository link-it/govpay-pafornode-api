# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

server.port=10004

# ddl-auto=validate, non create-drop: lo schema NON viene generato dalle entita', si
# verifica solo che corrisponda a quello reale (stesso schema condiviso di
# govpay-pendenze-api/govpay-common-pendenze).
# Lo schema e' caricato dal parametro INIT del driver H2 e non da spring.sql.init:
# quest'ultimo viene eseguito DOPO che Hibernate ha gia' validato le entita' contro uno
# schema ancora vuoto.
spring.datasource.url=jdbc:h2:mem:pafornode-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:db/schema-pendenze-test.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Autenticazione: PaForNodePrincipalLoader non e' registrato con questo profilo
# (@Profile("!test")), quindi la chain di govpay-common-auth non si attiva mai
# nei test (nessun GovpayPrincipalLoader nel contesto). Senza questa esclusione,
# spring-boot-starter-security ricadrebbe comunque sulla sua chain di default
# (form login generato), bloccando /ws/** dietro "Please sign in" e rompendo
# i test SOAP di business logic, che non devono occuparsi di autenticazione.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,\
org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
